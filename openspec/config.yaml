schema: spec-driven

context: |
  Tech stack: Next.js 16 (App Router), React 19, TypeScript, Tailwind CSS v4, Prisma ORM, Supabase / PostgreSQL.
  Architecture: Feature-sliced (src/features/*) + Route handlers / Server actions + Container-presentational UI.
  Testing: Vitest (unit/UI), React Testing Library, custom contract verifications; Playwright browser fixtures (not authenticated app E2E).
  Style: Mobile-first responsive, custom design tokens in globals.css and src/components/ui (Navy/White theme).

testing:
  strict_tdd: true
  scope: "Versioned configuration, not proof that checks were executed in this checkout"
  runner:
    command: "pnpm test:ui"
    framework: "vitest"
  layers:
    unit:
      available: true
      tool: "vitest"
    integration:
      available: true
      tool: "@testing-library/react"
    e2e:
      available: true
      tool: "@playwright/test (tests/playwright browser fixtures; not authenticated app E2E)"
  coverage:
    available: false
    command: null # No coverage provider is declared in package.json.
  quality:
    linter:
      available: true
      command: "pnpm lint"
    typechecker:
      available: true
      command: "pnpm typecheck"
    formatter:
      available: false
      command: null # pnpm lint runs ESLint, not a configured formatter.

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include component contracts and interaction flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns and container-presentational design
    - Follow the existing strict TDD setting for runnable deterministic behavior changes; see docs/AI_WORKFLOW.md for applicability and passive-documentation exceptions
    - "Test command: pnpm test:ui"
  verify:
    - "Test command: pnpm test:ui"
    - "Build command when applicable: pnpm build"
    - No minimum coverage percentage is configured (historical threshold was 0); do not claim coverage proof without a configured provider
  archive:
    - Warn before merging destructive deltas
