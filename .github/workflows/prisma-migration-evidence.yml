name: Prisma Migration Evidence

on:
  pull_request:
    branches: [develop]
    paths:
      - prisma/migrations/**
      - scripts/verify-quote-commercial-corrections-migration.sh
      - .github/workflows/prisma-migration-evidence.yml

permissions:
  contents: read

jobs:
  quote-commercial-corrections:
    name: Verify quote commercial correction migration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16-bookworm@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          DIRECT_URL: postgresql://postgres@127.0.0.1:5432/postgres
        run: pnpm exec prisma validate

      - name: Verify pgvector is available
        run: |
          psql postgresql://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION vector'
          psql postgresql://postgres@127.0.0.1:5432/postgres -v ON_ERROR_STOP=1 -c "SELECT extname FROM pg_extension WHERE extname = 'vector'"

      - name: Verify isolated PostgreSQL migration scenarios
        run: bash scripts/verify-quote-commercial-corrections-migration.sh
