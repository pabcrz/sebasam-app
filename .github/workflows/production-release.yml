name: Production Release

on:
  # Starting this workflow manually is the human production approval.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  migrate:
    name: Validate and apply versioned migrations
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Confirm human-approved main release
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            printf 'Production releases must be dispatched from main; received %s.\n' "$GITHUB_REF" >&2
            exit 1
          fi

          printf 'Manual workflow dispatch is the human approval for this production release from main.\n' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Check out release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0

      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate, apply, and verify committed migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          pnpm exec prisma validate
          pnpm db:migrate:deploy
          pnpm exec prisma migrate status

  deploy:
    name: Deploy the release revision to Vercel production
    needs: migrate
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.0

      - name: Enable Corepack
        run: corepack enable

      - name: Deploy the checked-out release revision to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm dlx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
